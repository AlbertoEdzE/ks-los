groups:
  - name: ks-los-alerts
    rules:
      - alert: HighErrorRate
        expr: (sum(rate(request_errors_total[5m])) / sum(rate(requests_total[5m]))) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate"
          description: "More than 5% errors over the last 10 minutes."
      - alert: HighLatency
        expr: (sum(rate(request_latency_seconds_sum[5m])) / sum(rate(request_latency_seconds_count[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High API latency"
          description: "Average latency exceeds 1s over the last 10 minutes."
      - alert: HighP99Latency
        expr: max(histogram_quantile(0.99, sum by (le) (rate(request_latency_seconds_bucket[5m])))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High API p99 latency"
          description: "p99 latency exceeds 2s over the last 10 minutes."
